<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="shubhrang-paint" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E2542B" />
      <stop offset="100%" stop-color="#F58737" />
    </linearGradient>
    <clipPath id="tile-clip">
      <rect width="64" height="64" rx="16" />
    </clipPath>
  </defs>
  <g clip-path="url(#tile-clip)">
    <rect width="64" height="64" fill="url(#shubhrang-paint)" />
    <!-- Sage green accent circle in bottom right corner -->
    <circle cx="60" cy="60" r="14" fill="#6A8E63" />
  </g>
  <!-- Letter S -->
  <text x="32" y="47" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', Arial, sans-serif" font-size="44" font-weight="800" fill="#FFFFFF" text-anchor="middle">S</text>
</svg>
